{% extends "base.html" %}

{% block title %}Editar Professor - Mr. Dave Idiomas{% endblock %}

{% block content %}
<div class="row mb-5">
    <div class="col-12">
        <h2 class="text-primary fw-bold mb-4">Editar Professor</h2>
        
        <div class="card shadow-sm border-0 mb-5">
            <div class="card-body p-4">
                <h4 class="card-title mb-3 fw-semibold text-secondary">Atualizar Dados do Professor</h4>
                
                <form action="/professores/atualizar/{{ professor[0] }}" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" value="{{ professor[1] }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-semibold">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ professor[2] }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="disciplina" class="form-label fw-semibold">Disciplina</label>
                            <input type="text" class="form-control" id="disciplina" name="disciplina" value="{{ professor[3] }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="cep" class="form-label fw-semibold">CEP</label>
                            <input type="text" class="form-control" id="cep" name="cep" value="{{ professor[4] }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="numero" class="form-label fw-semibold">Número</label>
                            <input type="text" class="form-control" id="numero" name="numero" value="{{ professor[9] }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-7 mb-3">
                            <label for="logradouro" class="form-label fw-semibold">Logradouro</label>
                            <input type="text" class="form-control" id="logradouro" name="logradouro" value="{{ professor[5] }}">
                        </div>
                        <div class="col-md-5 mb-3">
                            <label for="bairro" class="form-label fw-semibold">Bairro</label>
                            <input type="text" class="form-control" id="bairro" name="bairro" value="{{ professor[6] }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cidade" class="form-label fw-semibold">Cidade</label>
                            <input type="text" class="form-control" id="cidade" name="cidade" value="{{ professor[7] }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="uf" class="form-label fw-semibold">UF</label>
                            <input type="text" class="form-control" id="uf" name="uf" maxlength="2" value="{{ professor[8] }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="complemento" class="form-label fw-semibold">Complemento</label>
                            <input type="text" class="form-control" id="complemento" name="complemento" value="{{ professor[10] or '' }}">
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary fw-bold px-4">
                            Salvar Alterações
                        </button>
                        <a href="/professores" class="btn btn-secondary fw-bold px-4">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
