<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Gestão Escolar</title>
    <style>
        /* RN02 Visual: Campos bloqueados ficam cinzas para o usuário saber que não pode editar */
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>Cadastro de Novo Aluno</h2>
    
    <form id="formCadastro">
        <label>Nome:</label> <input type="text" id="nome" required><br>
        <label>E-mail:</label> <input type="email" id="email" required><br>
        <label>Senha:</label> <input type="password" id="senha" required><br>
        
        <hr>
        <label>CEP (Digite para preencher):</label> 
        <input type="text" id="cep" maxlength="8" required><br>
        
        <label>Logradouro:</label> <input type="text" id="logradouro" required><br>
        <label>Bairro:</label> <input type="text" id="bairro" required><br>
        <label>Cidade:</label> <input type="text" id="cidade" required><br>
        <label>UF:</label> <input type="text" id="uf" maxlength="2" required><br>
        
        <label>Número:</label> <input type="text" id="numero" required><br>
        <button type="submit">Finalizar Cadastro</button>
    </form>

    <script>
        // 1. A Automação do ViaCEP (RN08)
        const campoCep = document.getElementById('cep');
        
        // Evento 'blur': Dispara quando o usuário tira o cursor (sai) do campo CEP
        campoCep.addEventListener('blur', async () => {
            const cepDigitado = campoCep.value;
            
            if(cepDigitado.length === 8) {
                // A. Faz a ligação para o servidor público do ViaCEP
                const resposta = await fetch(`https://viacep.com.br/ws/${cepDigitado}/json/`);
                const dados = await resposta.json();
                
                if(!dados.erro) {
                    // B. Preenche os campos sozinhos
                    document.getElementById('logradouro').value = dados.logradouro;
                    document.getElementById('bairro').value = dados.bairro;
                    document.getElementById('cidade').value = dados.localidade;
                    document.getElementById('uf').value = dados.uf;
                    
                    // C. Cumpre a RN08: Bloqueia a edição manual
                    document.getElementById('logradouro').readOnly = true;
                    document.getElementById('bairro').readOnly = true;
                    document.getElementById('cidade').readOnly = true;
                    document.getElementById('uf').readOnly = true;
                    
                    // D. Pula o cursor direto pro Número (Usabilidade)
                    document.getElementById('numero').focus();
                } else {
                    alert("CEP não encontrado!");
                }
            }
        });

        // 2. O Envio dos dados para o nosso Backend Python
        document.getElementById('formCadastro').addEventListener('submit', async (evento) => {
            evento.preventDefault(); // Impede a tela de piscar/recarregar
            
            // Empacota os dados do formulário
            const pacoteJSON = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
                cep: document.getElementById('cep').value,
                logradouro: document.getElementById('logradouro').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                uf: document.getElementById('uf').value,
                numero: document.getElementById('numero').value
            };
            
            // Manda o pacote para o maestro (nosso Python /api/alunos)
            const resposta = await fetch('/api/alunos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pacoteJSON)
            });
            
            if(resposta.status === 201) {
                alert("Aluno salvo no banco de dados com sucesso!");
            } else {
                alert("Erro ao cadastrar. Tente outro e-mail.");
            }
        });
    </script>
</body>
</html>
