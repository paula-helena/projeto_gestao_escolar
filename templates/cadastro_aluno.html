{% extends "base.html" %}

{% block title %}Cadastro de Aluno - Mr. Dave Idiomas{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">Cadastro de Aluno</h3>
                
                <form id="formCadastro">
                    <!-- Dados Pessoais -->
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" required placeholder="Digite seu nome">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" required placeholder="seu@email.com">
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" required placeholder="Crie uma senha">
                    </div>

                    <hr class="my-4">
                    <h5 class="text-secondary mb-3">Endereço</h5>

                    <!-- CEP com Busca Automática -->
                    <div class="mb-3">
                        <label for="cep" class="form-label">CEP (Apenas números)</label>
                        <input type="text" class="form-control" id="cep" maxlength="8" required placeholder="12345678">
                        <div class="form-text">Digite os 8 dígitos para preencher o endereço automaticamente.</div>
                    </div>

                    <!-- Campos preenchidos via ViaCEP -->
                    <div class="mb-3">
                        <label for="logradouro" class="form-label">Logradouro / Rua</label>
                        <input type="text" class="form-control" id="logradouro" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="bairro" class="form-label">Bairro</label>
                            <input type="text" class="form-control" id="bairro" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="cidade" class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="cidade" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="uf" class="form-label">UF</label>
                            <input type="text" class="form-control" id="uf" maxlength="2" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="numero" class="form-label">Número</label>
                            <input type="text" class="form-control" id="numero" required placeholder="Ex: 123">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label for="complemento" class="form-label">Complemento <span class="text-muted">(Opcional)</span></label>
                            <input type="text" class="form-control" id="complemento" placeholder="Apto, Bloco, Casa...">
                        </div>
                    </div>

                    <!-- Botão de Envio -->
                    <div class="d-grid mt-4">
<button type="submit" class="btn btn-primary btn-lg">Finalizar Cadastro</button>
                    </div>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">Já tem uma conta? <a href="/login" class="text-decoration-none fw-bold">Faça Login</a></p>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<!-- Lógica JavaScript para ViaCEP e Submissão do Formulário -->
<script>
    // 1. Busca Automática de CEP (ViaCEP)
    document.getElementById('cep').addEventListener('blur', function() {
        let cep = this.value.replace(/\D/g, ''); // Remove tudo o que não for número
        
        if (cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(data => {
                    if (!data.erro) {
                        document.getElementById('logradouro').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('uf').value = data.uf;
                        
                        // Move o cursor automaticamente para o campo número
                        document.getElementById('numero').focus();
                    } else {
                        alert('CEP não encontrado. Verifique os números digitados.');
                    }
                })
                .catch(error => console.error('Erro ao buscar CEP:', error));
        }
    });

    // 2. Envio Assíncrono dos Dados para o Backend
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
        e.preventDefault(); // Impede a página de recarregar
        
        // Recolhe todos os dados dos inputs
        const dados = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
            cep: document.getElementById('cep').value,
            logradouro: document.getElementById('logradouro').value,
            bairro: document.getElementById('bairro').value,
            cidade: document.getElementById('cidade').value,
            uf: document.getElementById('uf').value,
            numero: document.getElementById('numero').value,
            complemento: document.getElementById('complemento').value
        };

        // Envia para a rota da API no Flask
        fetch('/api/alunos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        })
        .then(response => {
            if (response.ok) {
                alert('Cadastro realizado com sucesso! Pode agora fazer login.');
                window.location.href = '/login'; // Redireciona para o login
            } else {
                response.json().then(data => alert('Erro: ' + data.erro));
            }
        })
        .catch(error => {
            console.error('Erro na requisição:', error);
            alert('Ocorreu um erro no servidor. Tente novamente mais tarde.');
        });
    });
</script>
{% endblock %}
