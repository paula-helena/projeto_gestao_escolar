{% extends "base.html" %}

{% block title %}Redefinir senha - Mr. Dave Idiomas{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-3 text-primary fw-bold">Criar nova senha</h3>
                <p class="text-muted">Escolha uma senha com pelo menos 8 caracteres.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label for="senha" class="form-label">Nova senha</label>
                        <input type="password" class="form-control" id="senha" name="senha"
                               minlength="8" required autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label for="confirmacao" class="form-label">Confirme a nova senha</label>
                        <input type="password" class="form-control" id="confirmacao" name="confirmacao"
                               minlength="8" required autocomplete="new-password">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Salvar nova senha</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
