{% extends "base.html" %}

{% block title %}Login - Mr. Dave Idiomas{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center flex-grow-1 my-4">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">Entrar no Sistema</h3>
                
                <!-- Formulário enviando via POST para a rota /login -->
                <form action="/login" method="POST">
                    
                    <!-- Campo E-mail -->
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha" required autocomplete="current-password">
                    </div>

                    <!-- Botão de Enviar -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    </div>

                </form>
            </div>
            <div class="card-footer text-center bg-white border-0 py-3">
                <small class="text-muted">Ainda não tem conta? <a href="/cadastro" class="text-primary text-decoration-none fw-bold">Cadastre-se</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
