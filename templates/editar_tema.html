{% extends "base.html" %}

{% block title %}Editar Tema - Mr. Dave Idiomas{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">
                    <i class="bi bi-pencil-square me-2"></i>Editar Tema
                </h3>
                
                <form action="/temas/atualizar/{{ tema[0] }}" method="POST">
                    
                    <!-- Campo: Título -->
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">Título do Tema</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" value="{{ tema[1] }}" required>
                    </div>

                    <!-- Campo: Descrição -->
                    <div class="mb-4">
                        <label for="descricao" class="form-label fw-semibold">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="4">{{ tema[2] if tema[2] else '' }}</textarea>
                    </div>

                    <!-- Botões de Ação -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                        </button>
                        <a href="/temas" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
