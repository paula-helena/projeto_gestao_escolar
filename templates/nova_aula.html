{% extends "base.html" %}

{% block title %}Agendar Nova Aula - Mr. Dave Idiomas{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">
                    <i class="bi bi-calendar-plus me-2"></i>Agendar Nova Aula
                </h3>
               
                <!-- O formulário envia os dados via POST para a rota do app.py -->
                <form action="/aulas/nova" method="POST">
                   
                    <!-- Campo: Selecionar Aluno -->
                    <div class="mb-3">
                        <label for="id_aluno" class="form-label fw-semibold">Aluno</label>
                        <select class="form-select" id="id_aluno" name="id_aluno" required>
                            <option value="" selected disabled>Selecione um aluno...</option>
                            {% for aluno in alunos %}
                                <option value="{{ aluno[0] }}">{{ aluno[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Campo: Selecionar Tema da Lista Cadastrada + Botão de Atalho para Novo -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="tema" class="form-label fw-semibold mb-0">Tema da Aula</label>
                            <!-- Botão que abre o modal de novo tema de aula -->
                            <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none fw-bold text-primary" data-bs-toggle="modal" data-bs-target="#modalNovoTema">
                                <i class="bi bi-plus-circle me-1"></i>Novo Tema
                            </button>
                        </div>
                        <select class="form-select" id="tema" name="tema" required>
                            <option value="" selected disabled>Selecione um tema cadastrado...</option>
                            {% for t in temas %}
                                <!-- Se a sua coluna 'tema' na tabela Aula espera o título do tema (VARCHAR): -->
                                <option value="{{ t[1] }}">{{ t[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Campo: Data e Hora -->
                    <div class="mb-4">
                        <label for="data_hora" class="form-label fw-semibold">Data e Horário</label>
                        <input type="datetime-local" class="form-control" id="data_hora" name="data_hora" required>
                    </div>

                    <!-- Botões de Ação -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Agendar Aula
                        </button>
                        <a href="/aulas" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal do Bootstrap para Cadastrar Novo Tema de Aula de forma rápida -->
<div class="modal fade" id="modalNovoTema" tabindex="-1" aria-labelledby="modalNovoTemaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="modalNovoTemaLabel">
                    <i class="bi bi-journal-plus me-2"></i>Cadastrar Novo Tema
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- O formulário do modal envia o novo tema para a rota criada -->
            <form action="/temas/novo" method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nome_tema" class="form-label fw-semibold">Nome do Tema de Aula</label>
                        <input type="text" class="form-control" id="nome_tema" name="nome_tema" placeholder="Ex: Present Perfect, Conversação, Business English" required>
                        <div class="form-text">Esse tema ficará disponível para a seleção no agendamento.</div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-bold">Salvar Tema</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
