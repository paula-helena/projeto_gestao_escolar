{% extends "base.html" %}


{% block title %}Agendar Nova Aula - Mr. Dave Idiomas{% endblock %}


{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">
                    <i class="bi bi-calendar-plus me-2"></i>Agendar Nova Aula
                </h3>
               
                <!-- O formulário envia os dados via POST para a rota do app.py -->
                <form action="/aulas/nova" method="POST">
                   
                    <!-- Campo: Selecionar Aluno -->
                    <div class="mb-3">
                        <label for="id_aluno" class="form-label fw-semibold">Aluno</label>
                        <select class="form-select" id="id_aluno" name="id_aluno" required>
                            <option value="" selected disabled>Selecione um aluno...</option>
                            {% for aluno in alunos %}
                                <option value="{{ aluno[0] }}">{{ aluno[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>


                    <!-- Campo: Selecionar Tema da Lista Cadastrada -->
                    <div class="mb-3">
                        <label for="tema" class="form-label fw-semibold">Tema da Aula</label>
                        <select class="form-select" id="tema" name="tema" required>
                            <option value="" selected disabled>Selecione um tema cadastrado...</option>
                            {% for t in temas %}
                                <!-- Se a sua coluna 'tema' na tabela Aula espera o título do tema: -->
                                <option value="{{ t[1] }}">{{ t[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>


                    <!-- Campo: Data e Hora -->
                    <div class="mb-4">
                        <label for="data_hora" class="form-label fw-semibold">Data e Horário</label>
                        <input type="datetime-local" class="form-control" id="data_hora" name="data_hora" required>
                    </div>


                    <!-- Botões de Ação -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Agendar Aula
                        </button>
                        <a href="/aulas" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    </div>


                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
