{% extends "base.html" %}


{% block title %}Editar Aluno - Mr. Dave Idiomas{% endblock %}


{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">
                    <i class="bi bi-pencil-square me-2"></i>Editar Aluno
                </h3>
               
                <form action="/alunos/atualizar/{{ aluno[0] }}" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" value="{{ aluno[1] }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-semibold">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ aluno[2] }}" required>
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="cep" class="form-label fw-semibold">CEP</label>
                            <input type="text" class="form-control" id="cep" name="cep" value="{{ aluno[3] }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="logradouro" class="form-label fw-semibold">Logradouro</label>
                            <input type="text" class="form-control" id="logradouro" name="logradouro" value="{{ aluno[4] }}" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="numero" class="form-label fw-semibold">Número</label>
                            <input type="text" class="form-control" id="numero" name="numero" value="{{ aluno[8] if aluno[8] else '' }}">
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="bairro" class="form-label fw-semibold">Bairro</label>
                            <input type="text" class="form-control" id="bairro" name="bairro" value="{{ aluno[5] }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="cidade" class="form-label fw-semibold">Cidade</label>
                            <input type="text" class="form-control" id="cidade" name="cidade" value="{{ aluno[6] }}" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="uf" class="form-label fw-semibold">UF</label>
                            <input type="text" class="form-control" id="uf" name="uf" maxlength="2" value="{{ aluno[7] }}" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="complemento" class="form-label fw-semibold">Complemento</label>
                            <input type="text" class="form-control" id="complemento" name="complemento" value="{{ aluno[9] if aluno[9] else '' }}">
                        </div>
                    </div>


                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                        </button>
                        <a href="/alunos" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<script>
    // 1. Automação ViaCEP com Sanitização (RN08)
    const campoCep = document.getElementById('cep');
   
    campoCep.addEventListener('blur', async () => {
        const cepLimpo = campoCep.value.replace(/\D/g, '');
       
        if (cepLimpo.length === 8) {
            try {
                const resposta = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                const dados = await resposta.json();
               
                if (!dados.erro) {
                    document.getElementById('logradouro').value = dados.logradouro;
                    document.getElementById('bairro').value = dados.bairro;
                    document.getElementById('cidade').value = dados.localidade;
                    document.getElementById('uf').value = dados.uf;
                   
                    // Bloqueia a edição manual
                    document.getElementById('logradouro').readOnly = true;
                    document.getElementById('bairro').readOnly = true;
                    document.getElementById('cidade').readOnly = true;
                    document.getElementById('uf').readOnly = true;
                   
                    document.getElementById('numero').focus();
                } else {
                    alert("CEP não encontrado!");
                }
            } catch (erro) {
                alert("Erro ao consultar o CEP. Verifique sua conexão.");
            }
        }
    });


    // 2. Envio do formulário via API REST (/api/professores)
    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
        e.preventDefault();
       
        const pacote = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
            disciplina: document.getElementById('disciplina').value,
            cep: document.getElementById('cep').value.replace(/\D/g, ''),
            logradouro: document.getElementById('logradouro').value,
            bairro: document.getElementById('bairro').value,
            cidade: document.getElementById('cidade').value,
            uf: document.getElementById('uf').value,
            numero: document.getElementById('numero').value,
            complemento: document.getElementById('complemento').value // Campo incluído aqui
        };


        try {
            const resposta = await fetch('/api/professores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pacote)
            });


            const resultado = await resposta.json();


            if (resposta.status === 201) {
                alert("Professor cadastrado com sucesso!");
                document.getElementById('formCadastro').reset();
               
                // Desbloqueia os campos de endereço caso queira cadastrar outro em seguida
                ['logradouro', 'bairro', 'cidade', 'uf'].forEach(id => {
                    document.getElementById(id).readOnly = false;
                });
            } else {
                alert(resultado.erro || "Erro ao cadastrar. Verifique se o e-mail já existe.");
            }
        } catch (erro) {
            alert("Erro de comunicação com o servidor.");
        }
    });
</script>
{% endblock %}
